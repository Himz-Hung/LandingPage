<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạ Khoa — Công ty tổ chức sự kiện</title>
    <meta
      name="description"
      content="Tạ Khoa — tổ chức sự kiện trọn gói tại TP.HCM: sân khấu, âm thanh ánh sáng, màn hình LED, vận hành chương trình."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Đặt theme trước khi vẽ khung hình đầu tiên, nếu không trang sẽ
      // loé nền sáng rồi mới nhảy sang nền tối.
      ;(function () {
        try {
          var saved = localStorage.getItem('viper-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme =
            saved === 'light' || saved === 'dark' ? saved : prefersDark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
